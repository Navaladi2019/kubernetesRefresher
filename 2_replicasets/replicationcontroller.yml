apiVersion: v1
kind: ReplicationController
metadata:  # replication controller metadata
  name: myapp-rc
  labels:
    app: myapp
    type: front-end
spec:     # replication controller spec
  replicas: 2
  selector:
    app: myapp   # with selector app means the replication controller will look for pods with labes app=redis and it will consider those pods as manaed by this rc
  template:
    metadata:   # this metadata is same as metadata of pod definition
      labels:
        app: myapp
    spec:       # pod spec
      containers:
      - name: redis
        image: redis:latest
        ports:
        - containerPort: 6379