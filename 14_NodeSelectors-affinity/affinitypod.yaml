apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    app.kubernetes.io/name: myapp
spec:
  containers:
  - name: myapp
    image: <Image>
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
          - key: size
            operator: In  #NotIn  other operators as well
            values:
            - Large
            - Medium
    preferredDuringSchedulingIgnoredBuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
          - key: size
            operator: In  #NotIn  other operators as well
            values:
            - Large
            - Medium
