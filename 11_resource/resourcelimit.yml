apiVersion: v1
kind: Pod
metadata:
  name: myapp
  labels:
    app.kubernetes.io/name: myapp
spec:
  containers:
  - name: myapp
    image: <Image>
    resources:
      requests:  # guaranted amount of resources 
        memory: "128Mi"
        cpu: "500m"
      limits:     # maximun amount of memory it can consume
        memory: "500Mi"
        cpu: 2